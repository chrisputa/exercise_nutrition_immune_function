<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz - Exercise Nutrition Immune Function</title>
<style>
  :root{
    --rot:#A5132B;
    --rot-d:#7d0e20;
    --ink:#1a1a1a;
    --grey-1:#f5f5f4;
    --grey-2:#e7e5e4;
    --grey-3:#c8c5c2;
    --grey-4:#8a8784;
    --grey-5:#56524f;
    --ok:#2f6e3b;
    --ok-bg:#eaf3eb;
    --no:#A5132B;
    --no-bg:#fbecee;
    --paper:#ffffff;
    --radius:4px;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:transparent;
    line-height:1.55;
  }
  .wrap{max-width:none;margin:0;padding:0;}
  header.top{
    border-bottom:3px solid var(--rot);
    padding-bottom:14px;margin-bottom:24px;
  }
  header.top .kicker{
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--rot);font-weight:700;margin:0 0 4px;
  }
  header.top h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.01em;}
  header.top .sub{color:var(--grey-5);font-size:14px;margin-top:4px;}

  .card{
    background:var(--paper);
    border:1px solid var(--grey-2);
    border-radius:var(--radius);
    padding:26px;
  }

  /* Start screen */
  .lead{font-size:15px;color:var(--grey-5);margin:0 0 20px;}
  .opts-grid{display:grid;gap:14px;margin:18px 0 24px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
  select,input[type=number]{
    width:100%;padding:9px 10px;border:1px solid var(--grey-3);
    border-radius:var(--radius);font-size:15px;background:#fff;color:var(--ink);
  }
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .row>.field{flex:1;min-width:160px;}
  .check{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer;}
  .check input{width:17px;height:17px;accent-color:var(--rot);}

  .btn{
    display:inline-block;border:none;cursor:pointer;
    background:var(--rot);color:#fff;font-size:15px;font-weight:600;
    padding:12px 22px;border-radius:var(--radius);
    transition:background .15s;
  }
  .btn:hover{background:var(--rot-d);}
  .btn:focus-visible{outline:3px solid var(--rot);outline-offset:2px;}
  .btn.ghost{background:#fff;color:var(--rot);border:1px solid var(--rot);}
  .btn.ghost:hover{background:var(--no-bg);}
  .btn.grey{background:var(--grey-2);color:var(--ink);}
  .btn.grey:hover{background:var(--grey-3);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  /* Quiz screen */
  .meta-bar{
    display:flex;justify-content:space-between;align-items:center;
    font-size:13px;color:var(--grey-5);margin-bottom:10px;
  }
  .tags{display:flex;gap:6px;}
  .tag{
    font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;
    padding:2px 8px;border-radius:99px;background:var(--grey-2);color:var(--grey-5);
  }
  .tag.lvl{color:#fff;}
  .tag.lvl1{background:var(--grey-4);}
  .tag.lvl2{background:var(--grey-5);}
  .tag.lvl3{background:var(--rot);}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);}
  .progress{height:5px;background:var(--grey-2);border-radius:99px;overflow:hidden;margin-bottom:18px;}
  .progress>span{display:block;height:100%;background:var(--rot);width:0;transition:width .25s;}
  .qtext{font-size:18px;font-weight:600;margin:0 0 18px;line-height:1.4;}
  .answers{display:grid;gap:10px;}
  .ans{
    text-align:left;width:100%;cursor:pointer;
    background:#fff;border:1px solid var(--grey-3);border-radius:var(--radius);
    padding:13px 15px;font-size:15px;color:var(--ink);
    display:flex;gap:12px;align-items:flex-start;transition:border-color .12s,background .12s;
  }
  .ans:hover:not(:disabled){border-color:var(--rot);}
  .ans:focus-visible{outline:3px solid var(--rot);outline-offset:2px;}
  .ans .letter{
    flex:0 0 auto;font-weight:700;color:var(--grey-4);
    width:22px;height:22px;border:1px solid var(--grey-3);border-radius:99px;
    display:flex;align-items:center;justify-content:center;font-size:12px;margin-top:1px;
  }
  .ans.correct{background:var(--ok-bg);border-color:var(--ok);}
  .ans.correct .letter{background:var(--ok);color:#fff;border-color:var(--ok);}
  .ans.wrong{background:var(--no-bg);border-color:var(--no);}
  .ans.wrong .letter{background:var(--no);color:#fff;border-color:var(--no);}
  .ans:disabled{cursor:default;}
  .feedback{margin-top:16px;font-size:14px;min-height:24px;}
  .feedback .fb-ok{color:var(--ok);font-weight:600;}
  .feedback .fb-no{color:var(--no);font-weight:600;}
  .navbtns{margin-top:22px;display:flex;justify-content:flex-end;}

  /* Results */
  .scorebox{
    display:flex;gap:18px;flex-wrap:wrap;margin:4px 0 24px;
  }
  .stat{
    flex:1;min-width:130px;border:1px solid var(--grey-2);border-radius:var(--radius);
    padding:16px;text-align:center;background:#fff;
  }
  .stat .num{font-size:30px;font-weight:700;line-height:1;}
  .stat .num.accent{color:var(--rot);}
  .stat .lbl{font-size:12px;color:var(--grey-5);margin-top:6px;text-transform:uppercase;letter-spacing:.06em;}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
  th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--grey-2);}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--grey-5);font-weight:700;}
  td.c{text-align:center;}
  td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .dot{display:inline-block;width:10px;height:10px;border-radius:99px;}
  .dot.ok{background:var(--ok);}
  .dot.no{background:var(--no);}
  .result-actions{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap;}
  .hidden{display:none;}
  .qcell{max-width:340px;}
  footer.foot{margin-top:32px;font-size:12px;color:var(--grey-4);text-align:center;}
  @media (max-width:560px){
    .card{padding:18px;}
    .qcell{max-width:none;}
    table{font-size:12px;}
    th,td{padding:6px 5px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- START -->
  <section id="start" class="card">
    <p class="lead">Wähle Umfang und Stufen, dann starte das Quiz. Pro Frage werden Antwortzeit und Ergebnis erfasst. Die Antwortoptionen werden bei jedem Durchlauf neu gemischt.</p>
    <div class="opts-grid">
      <div class="row">
        <div class="field">
          <label for="levelSel">Schwierigkeit</label>
          <select id="levelSel">
            <option value="0">Alle Stufen</option>
            <option value="1">Nur Stufe 1 – leicht</option>
            <option value="2">Nur Stufe 2 – mittel</option>
            <option value="3">Nur Stufe 3 – schwer</option>
          </select>
        </div>
        <div class="field">
          <label for="lecSel">Lecture</label>
          <select id="lecSel">
            <option value="all">Alle Lectures</option>
            <option value="L1">Nur Lecture 1</option>
            <option value="L2">Nur Lecture 2</option>
            <option value="L3">Nur Lecture 3</option>
            <option value="L4">Nur Lecture 4</option>
            <option value="L5">Nur Lecture 5</option>
            <option value="L6">Nur Lecture 6</option>
            <option value="L7">Nur Lecture 7</option>
            <option value="L8">Nur Lecture 8</option>
            <option value="L9">Nur Lecture 9</option>
            <option value="L10">Nur Lecture 10</option>
          </select>
        </div>
        <div class="field">
          <label for="countSel">Anzahl Fragen</label>
          <input type="number" id="countSel" min="1" value="20">
        </div>
      </div>
      <label class="check"><input type="checkbox" id="shuffleQ" checked> Fragen in zufälliger Reihenfolge</label>
      <label class="check"><input type="checkbox" id="instantFb" checked> Sofortiges Feedback nach jeder Antwort</label>
    </div>
    <button class="btn" id="startBtn">Quiz starten</button>
    <p class="sub" id="poolInfo" style="margin-top:14px;"></p>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="card hidden">
    <div class="meta-bar">
      <div class="tags" id="qtags"></div>
      <div class="timer" id="qtimer">0,0 s</div>
    </div>
    <div class="progress"><span id="progBar"></span></div>
    <p class="qtext" id="qtext"></p>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
    <div class="navbtns">
      <button class="btn" id="nextBtn" disabled>Weiter</button>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="results" class="card hidden">
    <p class="kicker" style="color:var(--rot);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 4px;">Ergebnis</p>
    <h2 style="margin:0 0 18px;font-size:22px;" id="scoreHead">Auswertung</h2>
    <div class="scorebox">
      <div class="stat"><div class="num accent" id="sCorrect">0</div><div class="lbl">richtig</div></div>
      <div class="stat"><div class="num" id="sPct">0&nbsp;%</div><div class="lbl">Trefferquote</div></div>
      <div class="stat"><div class="num" id="sTotal">0&nbsp;s</div><div class="lbl">Gesamtzeit</div></div>
      <div class="stat"><div class="num" id="sAvg">0&nbsp;s</div><div class="lbl">Ø pro Frage</div></div>
    </div>
    <table id="resultTable">
      <thead>
        <tr><th>#</th><th>Stufe</th><th>Lec.</th><th class="qcell">Frage</th><th class="c">✓/✗</th><th class="num">Zeit</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="result-actions">
      <button class="btn" id="retryBtn">Neues Quiz</button>
      <button class="btn ghost" id="csvBtn">Ergebnis als CSV</button>
    </div>
  </section>
</div>

/* ============================================================
   STATE & HELFER
   ============================================================ */
const LETTERS = ["A","B","C","D","E"];
const $ = id => document.getElementById(id);

let session = null;        // aktuelle Quiz-Session
let qStartTime = 0;        // Startzeitpunkt der aktuellen Frage (ms)
let tickHandle = null;     // Intervall für Live-Timer

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function fmt(sec){ return sec.toFixed(1).replace(".",",") + " s"; }

function buildOptions(item){
  // Optionen mischen, Index der richtigen Antwort merken
  const opts = shuffle([{t:item.correct,ok:true}, ...item.wrong.map(w=>({t:w,ok:false}))]);
  return opts;
}

const pool0 = () => { const lvl = parseInt($("levelSel").value,10); const lec = $("lecSel").value;
  return BANK.filter(q => (lvl===0 || q.level===lvl) && (lec==="all" || q.lec===lec)); };
// Pool-Info beim Laden / bei Filteränderung
function updatePoolInfo(){
  const pool = pool0();
  const max = pool.length;
  const inp = $("countSel");
  inp.max = max;
  if(parseInt(inp.value,10) > max) inp.value = max;
  $("poolInfo").textContent = `Verfügbar in der Auswahl: ${max} Fragen.`;
}
$("levelSel").addEventListener("change", updatePoolInfo);
$("lecSel").addEventListener("change", updatePoolInfo);
updatePoolInfo();

/* ============================================================
   QUIZ-ABLAUF
   ============================================================ */
function startQuiz(){
  let pool = pool0().slice();
  if($("shuffleQ").checked) pool = shuffle(pool);
  let count = parseInt($("countSel").value,10);
  if(isNaN(count) || count<1) count = 1;
  count = Math.min(count, pool.length);
  pool = pool.slice(0, count);

  session = {
    questions: pool.map(item => ({...item, options: buildOptions(item)})),
    idx: 0,
    instant: $("instantFb").checked,
    results: []   // {n, level, lec, q, correct(bool), timeSec, picked, answer}
  };

  $("start").classList.add("hidden");
  $("results").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  renderQuestion();
}

function renderQuestion(){
  const s = session;
  const item = s.questions[s.idx];

  // Tags & Fortschritt
  const lvlNames = {1:"Leicht",2:"Mittel",3:"Schwer"};
  $("qtags").innerHTML =
    `<span class="tag lvl lvl${item.level}">Stufe ${item.level} · ${lvlNames[item.level]}</span>`+
    `<span class="tag">${item.lec}</span>`+
    `<span class="tag">Frage ${s.idx+1}/${s.questions.length}</span>`;
  $("progBar").style.width = ((s.idx)/s.questions.length*100) + "%";

  $("qtext").textContent = item.q;
  $("feedback").innerHTML = "";
  $("nextBtn").disabled = true;
  $("nextBtn").textContent = (s.idx === s.questions.length-1) ? "Auswerten" : "Weiter";

  // Antworten
  const wrap = $("answers");
  wrap.innerHTML = "";
  item.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "ans";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${LETTERS[i]}</span><span>${opt.t}</span>`;
    btn.addEventListener("click", () => pick(i, btn));
    wrap.appendChild(btn);
  });

  // Timer starten
  qStartTime = performance.now();
  startTick();
}

function startTick(){
  stopTick();
  $("qtimer").textContent = "0,0 s";
  tickHandle = setInterval(() => {
    const el = (performance.now()-qStartTime)/1000;
    $("qtimer").textContent = fmt(el);
  }, 100);
}
function stopTick(){ if(tickHandle){clearInterval(tickHandle); tickHandle=null;} }

function pick(i, btn){
  const s = session;
  const item = s.questions[s.idx];
  const timeSec = (performance.now()-qStartTime)/1000;
  stopTick();
  $("qtimer").textContent = fmt(timeSec);

  const chosen = item.options[i];
  const correct = !!chosen.ok;

  // Auswahl protokollieren
  s.results.push({
    n:item.n, level:item.level, lec:item.lec, q:item.q,
    correct, timeSec,
    answer: chosen.t,
    correctAnswer: item.correct
  });

  // Buttons sperren + markieren
  const btns = $("answers").querySelectorAll(".ans");
  btns.forEach((b, j) => {
    b.disabled = true;
    if(s.instant){
      if(item.options[j].ok) b.classList.add("correct");
      if(j===i && !correct) b.classList.add("wrong");
    } else if(j===i){
      b.classList.add(correct ? "correct" : "wrong");
    }
  });

  // Feedback
  if(s.instant){
    $("feedback").innerHTML = correct
      ? `<span class="fb-ok">Richtig.</span> <span style="color:var(--grey-5)">(${fmt(timeSec)})</span>`
      : `<span class="fb-no">Leider falsch.</span> <span style="color:var(--grey-5)">Richtig wäre: ${item.correct}</span>`;
  } else {
    $("feedback").innerHTML = `<span style="color:var(--grey-5)">Antwort erfasst (${fmt(timeSec)}).</span>`;
  }

  $("nextBtn").disabled = false;
  $("nextBtn").focus();
}

function next(){
  const s = session;
  if(s.idx < s.questions.length-1){
    s.idx++;
    renderQuestion();
  } else {
    showResults();
  }
}

/* ============================================================
   ERGEBNIS
   ============================================================ */
function showResults(){
  stopTick();
  const s = session;
  $("quiz").classList.add("hidden");
  $("results").classList.remove("hidden");
  $("progBar").style.width = "100%";

  const total = s.results.length;
  const right = s.results.filter(r=>r.correct).length;
  const totalTime = s.results.reduce((a,r)=>a+r.timeSec,0);
  const pct = total ? Math.round(right/total*100) : 0;
  const avg = total ? totalTime/total : 0;

  $("scoreHead").textContent = `${right} von ${total} Fragen richtig`;
  $("sCorrect").textContent = right;
  $("sPct").innerHTML = pct + "&nbsp;%";
  $("sTotal").innerHTML = totalTime.toFixed(0) + "&nbsp;s";
  $("sAvg").innerHTML = avg.toFixed(1).replace(".",",") + "&nbsp;s";

  const lvlNames = {1:"1 · leicht",2:"2 · mittel",3:"3 · schwer"};
  const tb = $("resultTable").querySelector("tbody");
  tb.innerHTML = "";
  s.results.forEach((r, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML =
      `<td>${i+1}</td>`+
      `<td>${lvlNames[r.level]}</td>`+
      `<td>${r.lec}</td>`+
      `<td class="qcell">${r.q}</td>`+
      `<td class="c"><span class="dot ${r.correct?'ok':'no'}" title="${r.correct?'richtig':'falsch'}"></span></td>`+
      `<td class="num">${fmt(r.timeSec)}</td>`;
    tb.appendChild(tr);
  });
}

function downloadCSV(){
  const s = session;
  const sep = ";";
  const head = ["Nr","Stufe","Lecture","Frage","Antwort_gewaehlt","Richtige_Antwort","Korrekt","Zeit_Sekunden"];
  const esc = v => `"${String(v).replace(/"/g,'""')}"`;
  const rows = s.results.map((r,i) => [
    i+1, r.level, r.lec, r.q, r.answer, r.correctAnswer,
    r.correct?"ja":"nein", r.timeSec.toFixed(2).replace(".",",")
  ].map(esc).join(sep));

  const right = s.results.filter(r=>r.correct).length;
  const totalTime = s.results.reduce((a,r)=>a+r.timeSec,0);
  const summary = [
    "", "",
    `Summe${sep}${esc("Richtig: "+right+" / "+s.results.length)}${sep}${esc("Gesamtzeit (s): "+totalTime.toFixed(2).replace(".",","))}`
  ];

  const csv = "\uFEFF" + [head.map(esc).join(sep), ...rows, ...summary].join("\r\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0,16).replace(/[:T]/g,"-");
  a.href = url; a.download = `quiz_ergebnis_${stamp}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function resetToStart(){
  $("results").classList.add("hidden");
  $("quiz").classList.add("hidden");
  $("start").classList.remove("hidden");
  $("progBar").style.width = "0%";
  updatePoolInfo();
}

/* ============================================================
   EVENTS
   ============================================================ */
$("startBtn").addEventListener("click", startQuiz);
$("nextBtn").addEventListener("click", next);
$("retryBtn").addEventListener("click", resetToStart);
$("csvBtn").addEventListener("click", downloadCSV);
</script>
